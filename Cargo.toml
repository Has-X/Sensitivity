[package]
name = "sensitivity"
version = "1.1.2"
edition = "2021"
authors = ["HasX <mi@hasx.dev>"]
description = "Sensitivity: a direct-USB Xiaomi Recovery flash and rescue CLI"
license = "AGPL-3.0-only"
repository = "https://github.com/Has-X/Sensitivity"
homepage = "https://github.com/Has-X/Sensitivity"
readme = "README.md"
rust-version = "1.88"

[workspace]
members = [".", "crates/gui"]
exclude = ["fuzz"]
resolver = "2"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
ctrlc = "3.4"
rusb = { version = "0.9", features = ["vendored"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17"
md-5 = "0.11"
hex = "0.4"
byteorder = "1.5"

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "sensitivity"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = "symbols"
