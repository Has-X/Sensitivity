[package]
name = "sensitivity"
version = "1.1.0"
edition = "2021"
rust-version = "1.97"
authors = ["HasX <mi@hasx.dev>"]
description = "Sensitivity: ADB-over-USB sideload and Xiaomi Recovery ROM validator"
license = "AGPL-3.0-only"
repository = "https://github.com/Has-X/Sensitivity"
homepage = "https://github.com/Has-X/Sensitivity"
readme = "README.md"
keywords = ["xiaomi", "recovery", "adb", "sideload", "rom"]
categories = ["command-line-utilities", "hardware-support"]

[features]
default = []
gui = ["dep:eframe"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rusb = { version = "0.9", features = ["vendored"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17"
md-5 = "0.10"
hex = "0.4"
byteorder = "1.5"
log = "0.4"
env_logger = "0.11"
dirs-next = "2"
eframe = { version = "=0.36.1", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "sensitivity"
path = "src/main.rs"

[[bin]]
name = "sensitivity-gui"
path = "src/bin/sensitivity-gui.rs"
required-features = ["gui"]
