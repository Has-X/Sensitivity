[package]
name = "sensitivity"
version = "1.1.3"
edition = "2021"
authors = ["Chromatic <feedback@chromatic.hu>"]
description = "Sensitivity: a direct-USB Xiaomi Recovery flash and rescue CLI"
license = "AGPL-3.0-only"
repository = "https://github.com/Has-X/Sensitivity"
homepage = "https://chromatic.hu"
readme = "README.md"
rust-version = "1.97"

[workspace]
members = [".", "crates/gui"]
exclude = ["fuzz"]
resolver = "2"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
ctrlc = "3.5"
rusb = { version = "0.9", features = ["vendored"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "form", "json", "rustls"] }
base64 = "0.23"
aes = "0.9"
cbc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.18"
md-5 = "0.11"
hex = "0.4"
byteorder = "1.5"

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "sensitivity"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = "symbols"
