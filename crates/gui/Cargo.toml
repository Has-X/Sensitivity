[package]
name = "sensitivity-gui"
version = "1.1.1"
edition = "2021"
rust-version = "1.88"
authors = ["HasX <mi@hasx.dev>"]
description = "Sensitivity graphical Xiaomi Recovery flash and rescue tool"
license = "AGPL-3.0-only"
repository = "https://github.com/Has-X/Sensitivity"
publish = false

[dependencies]
anyhow = "1"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
rfd = "0.17.2"
sensitivity = { version = "1.1.1", path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.bundle]
name = "Sensitivity"
identifier = "dev.hasx.sensitivity"
category = "public.app-category.utilities"
short_description = "Xiaomi Recovery flash and rescue tool"
copyright = "Copyright 2025 HasX and contributors"
