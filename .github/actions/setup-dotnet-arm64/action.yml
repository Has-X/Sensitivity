name: Set up .NET SDK for Windows ARM64
description: Installs the .NET 10 SDK without the PowerShell 7 bootstrap path that intermittently crashes on GitHub's Windows ARM runners.

runs:
  using: composite
  steps:
    - name: Install .NET 10 ARM64 SDK
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        $installer = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
        $installRoot = Join-Path $env:RUNNER_TEMP 'dotnet-arm64'

        Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -OutFile $installer -UseBasicParsing
        & $installer -Channel 10.0 -Architecture arm64 -InstallDir $installRoot -NoPath
        if ($LASTEXITCODE -ne 0) { throw "dotnet-install.ps1 failed with exit code $LASTEXITCODE" }

        $dotnet = Join-Path $installRoot 'dotnet.exe'
        if (!(Test-Path $dotnet)) { throw 'The ARM64 .NET SDK installation did not produce dotnet.exe' }
        & $dotnet --info
        if ($LASTEXITCODE -ne 0) { throw "The installed ARM64 .NET SDK failed verification with exit code $LASTEXITCODE" }

        $installRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "DOTNET_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
