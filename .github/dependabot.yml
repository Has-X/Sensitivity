version: 2
updates:
  - package-ecosystem: nuget
    directory: "/apps/windows/Sensitivity.WinUI"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      windows-dependencies:
        update-types: ["major", "minor", "patch"]
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      rust-dependencies:
        update-types: ["major", "minor", "patch"]
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      fuzz-dependencies:
        update-types: ["major", "minor", "patch"]
