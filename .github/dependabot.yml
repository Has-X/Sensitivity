version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      rust-minor-patches:
        update-types: ["patch", "minor"]
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      fuzz-dependencies:
        update-types: ["patch", "minor"]
