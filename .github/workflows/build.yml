name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache target dir
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Build (release)
        run: cargo build --workspace --release --locked

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Prepare artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/sensitivity dist/sensitivity-linux-x86_64
          cp target/release/sensitivity-gui dist/sensitivity-gui-linux-x86_64

      - name: Prepare artifact (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/sensitivity dist/sensitivity-macos-aarch64
          cp target/release/sensitivity-gui dist/sensitivity-gui-macos-aarch64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sensitivity-${{ runner.os }}-${{ runner.arch }}
          path: dist/*

  windows-native:
    name: Build native Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sensitivity --locked
      - run: cargo clippy -p sensitivity --all-targets --locked -- -D warnings
      - run: cargo build -p sensitivity --release --locked
      - name: Publish WinUI 3 app
        shell: pwsh
        run: |
          dotnet publish apps/windows/Sensitivity.WinUI/Sensitivity.WinUI.csproj -c Release -r win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -o native-publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/release/sensitivity.exe native-publish/sensitivity-cli.exe
          if (!(Test-Path native-publish/Sensitivity.exe)) { throw "Sensitivity.exe was not published" }
          if (!(Test-Path native-publish/sensitivity-cli.exe)) { throw "sensitivity-cli.exe was not packaged" }
      - uses: actions/upload-artifact@v7
        with:
          name: sensitivity-Windows-X64
          path: native-publish/*
          if-no-files-found: error

  msrv:
    name: Minimum Rust 1.88
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  fuzz-target:
    name: Fuzz target compiles
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo check --manifest-path fuzz/Cargo.toml --locked
