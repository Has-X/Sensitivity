name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Validate locales
        shell: pwsh
        run: pwsh -NoProfile -File tools/check-locales.ps1
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Check fuzz target
        run: cargo check --manifest-path fuzz/Cargo.toml --locked

  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            archive: sensitivity-linux-x86_64.tar.gz
          - name: windows-x86_64
            os: windows-latest
            archive: sensitivity-windows-x86_64.zip
            runtime: win-x64
            rust_target: x86_64-pc-windows-msvc
            app_architecture: x64
            platform: x64
          - name: windows-arm64
            os: windows-11-arm
            archive: sensitivity-windows-arm64.zip
            runtime: win-arm64
            rust_target: aarch64-pc-windows-msvc
            app_architecture: arm64
            platform: ARM64
          - name: macos-x86_64
            os: macos-15-intel
            archive: sensitivity-macos-x86_64.tar.gz
          - name: macos-aarch64
            os: macos-14
            archive: sensitivity-macos-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    needs: preflight
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-dotnet@v6
        if: matrix.runtime != ''
        with:
          dotnet-version: 10.0.x
      - uses: Swatinem/rust-cache@v2
      - name: Install Windows Rust target
        if: matrix.runtime != ''
        run: rustup target add ${{ matrix.rust_target }}
      - name: Test Rust workspace
        if: matrix.runtime == ''
        run: cargo test --workspace --locked
      - name: Build Rust workspace
        if: matrix.runtime == ''
        run: cargo build --workspace --release --locked
      - name: Test Windows backend
        if: matrix.runtime == 'win-x64'
        run: cargo test -p sensitivity --locked
      - name: Build Windows backend
        if: matrix.runtime == 'win-x64'
        run: cargo build -p sensitivity --release --target ${{ matrix.rust_target }} --locked
      - name: Build ARM64 Windows backend
        if: matrix.runtime == 'win-arm64'
        run: cargo build -p sensitivity --release --target ${{ matrix.rust_target }} --locked
      - name: Publish native Windows app
        if: matrix.runtime != ''
        shell: pwsh
        run: |
          dotnet publish apps/windows/Sensitivity.WinUI/Sensitivity.WinUI.csproj -c Release -r ${{ matrix.runtime }} -p:Platform=${{ matrix.platform }} --self-contained true -p:DebugType=None -p:DebugSymbols=false -o native-publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/${{ matrix.rust_target }}/release/sensitivity.exe native-publish/sensitivity-cli.exe
          if (!(Test-Path native-publish/Sensitivity.exe)) { throw "Sensitivity.exe was not published" }
          if (!(Test-Path native-publish/sensitivity-cli.exe)) { throw "sensitivity-cli.exe was not packaged" }
      - name: Package Unix
        if: matrix.runtime == ''
        shell: bash
        run: |
          mkdir package
          cp target/release/sensitivity package/sensitivity
          cp target/release/sensitivity-gui package/sensitivity-gui
          cp README.md LICENSE package/
          cp -R docs package/docs
          mkdir package/completions
          target/release/sensitivity completions bash > package/completions/sensitivity.bash
          target/release/sensitivity completions zsh > package/completions/_sensitivity
          target/release/sensitivity completions fish > package/completions/sensitivity.fish
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp packaging/linux/70-sensitivity.rules packaging/linux/install-udev-rule.sh package/
            chmod +x package/install-udev-rule.sh
          else
            mkdir -p package/Sensitivity.app/Contents/MacOS
            cp target/release/sensitivity-gui package/Sensitivity.app/Contents/MacOS/
            cp packaging/macos/Info.plist package/Sensitivity.app/Contents/
            VERSION="$(cargo metadata --format-version 1 --no-deps | sed -n 's/.*\"name\":\"sensitivity\",\"version\":\"\([^\"]*\)\".*/\1/p')"
            sed -i.bak "s/@VERSION@/$VERSION/g" package/Sensitivity.app/Contents/Info.plist
            rm package/Sensitivity.app/Contents/Info.plist.bak
          fi
          tar -C package -czf "${{ matrix.archive }}" .
      - name: Package Windows
        if: matrix.runtime != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory package | Out-Null
          Copy-Item native-publish/* package -Recurse
          Copy-Item README.md, LICENSE, SECURITY.md, CODE_OF_CONDUCT.md, CONTRIBUTING.md package/
          Copy-Item docs package/docs -Recurse
          Copy-Item packaging/windows/README-WINDOWS.md package/
          New-Item -ItemType Directory -Force package/completions | Out-Null
          & target/${{ matrix.rust_target }}/release/sensitivity.exe completions powershell | Out-File -Encoding utf8 package/completions/_sensitivity.ps1
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.archive }}"
      - name: Build Windows installer
        if: matrix.runtime != ''
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup.7 --exact --source winget --accept-package-agreements --accept-source-agreements --silent
          $version = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages[0].version
          $iscc = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 7\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup 7 compiler was not installed' }
          New-Item -ItemType Directory -Force installer-out | Out-Null
          & $iscc "/DAppVersion=$version" "/DAppArchitecture=${{ matrix.app_architecture }}" "/DSourceDir=$PWD\native-publish" "/DOutputDir=$PWD\installer-out" installer/Sensitivity.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "installer-out/Sensitivity-Setup-${{ matrix.app_architecture }}.exe" "sensitivity-windows-${{ matrix.app_architecture }}-setup.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.archive }}
            sensitivity-*-setup.exe
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum sensitivity-* > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
