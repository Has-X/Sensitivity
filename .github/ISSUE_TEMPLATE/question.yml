name: Usage question
description: Ask a focused question about a documented workflow
title: "question: "
labels: ["question", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Check the README and Wiki first. Never include serial numbers, validation tokens, or private ROM links.
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant redacted context
